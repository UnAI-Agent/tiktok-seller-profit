# LLE / staging API. Deploy from backend/:
#   fly apps create marginmark-api-lle
#   fly deploy --config fly.lle.toml
#
# Scale-to-zero when idle. Stripe test keys only. Own Neon branch.

app = "marginmark-api-lle"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  ENV = "production"
  APP_ENV = "lle"
  PORT = "8000"
  PUBLIC_BASE_URL = "https://api-lle.plainsmansoftware.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
