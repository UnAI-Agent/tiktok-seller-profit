# Production API. Deploy from backend/:
#   fly apps create marginmark-api-prod
#   fly deploy --config fly.prod.toml
#
# Keep one machine warm. Live Stripe keys. Prod Neon (pooled DATABASE_URL).

app = "marginmark-api-prod"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  ENV = "production"
  APP_ENV = "prod"
  PORT = "8000"
  PUBLIC_BASE_URL = "https://api.plainsmansoftware.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
