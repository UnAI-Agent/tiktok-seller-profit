name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baselines:
        description: "Write Linux screenshot baselines (download the artifact, review, commit)"
        type: boolean
        default: false
jobs:
  everything:
    if: ${{ !inputs.baselines }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
    # The extension tests run headed Chromium; give it a virtual display.
    - run: xvfb-run -a npm run test:everything
      env:
        E2E_PYTHON: python3
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qa-report
        path: qa/report/
  baselines:
    if: ${{ inputs.baselines }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
    - run: xvfb-run -a npm run test:baselines
      env:
        E2E_PYTHON: python3
    - uses: actions/upload-artifact@v4
      with:
        name: linux-screenshot-baselines
        path: e2e/specs/12-visual-a11y.spec.ts-snapshots/
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh scripts/check-secrets.ps1 -All
